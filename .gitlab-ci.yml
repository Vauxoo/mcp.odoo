workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[(patch|minor|major)\]/i
      auto_cancel:
        on_new_commit: none
    - when: always

default:
  interruptible: true

stages:
  - lint
  - build
  - test
  - release
  - deploy
  - notify

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

# A scheduled pipeline exists only to verify that the published package still
# installs (see verify-pypi below). Every other job is excluded from it: on main
# the schedule would otherwise release, redeploy pages, mirror and notify.
.not-on-schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

.python-template:
  image: python:3.12-slim
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[dev]"

lint:
  extends: .python-template
  stage: lint
  script:
    - ruff check odoo_mcp_multi/
    - ruff format --check odoo_mcp_multi/
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint-markdown:
  image: node:20-slim
  stage: lint
  script:
    - npm install -g markdownlint-cli2
    - markdownlint-cli2 "**/*.md" "#node_modules"
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG


# Validates the root .claude-plugin/plugin.json (Claude Code plugin
# consumed by the ai/marketplace catalog) with the official CLI.
validate-plugin:
  image: node:22-slim
  stage: lint
  script:
    - npm install -g @anthropic-ai/claude-code
    - claude plugin validate .
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# The suite runs against the wheel users install, on every Python the package
# declares, each on a bare image: nothing from the checkout is importable, so
# a file missing from the wheel or an undeclared dependency fails here rather
# than on a user's machine. `test` then combines the runs, so a branch only one
# Python takes still counts as covered — and one it never takes shows up.
# ---------------------------------------------------------------------------
build:
  image: python:3.12-slim
  stage: build
  script:
    - pip install build
    - python -m build --wheel
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test-python:
  image: python:${PYTHON}-slim
  stage: test
  needs:
    - build
  parallel:
    matrix:
      - PYTHON: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  variables:
    COVERAGE_FILE: ".coverage.${PYTHON}"
    # 3.14's default sys.monitoring core drops the per-test contexts shown in htmlcov.
    COVERAGE_CORE: ctrace
  script:
    - pip install --upgrade pip
    - pip install "$(ls dist/*.whl)[dev]"
    # With the checkout's copy gone, the only importable odoo_mcp_multi is the
    # wheel, whatever way pytest is invoked.
    - rm -rf odoo_mcp_multi
    - pytest
  artifacts:
    paths:
      - .coverage.${PYTHON}
    expire_in: 1 day
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  image: python:3.12-slim
  stage: test
  needs:
    - test-python
  script:
    - pip install coverage
    - python -m coverage combine .coverage.3.*
    - python -m coverage report
    - python -m coverage xml
    - python -m coverage html -d htmlcov
    - >-
      python -c "import xml.etree.ElementTree as ET; r = ET.parse('coverage.xml').getroot();
      print(f\"Lines: {float(r.get('line-rate')) * 100:.2f}%  Branches: {float(r.get('branch-rate')) * 100:.2f}%\")"
  artifacts:
    paths:
      - htmlcov
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Install the package the way users do — pip, pipx, uv tool, uvx — on a bare
# image with the oldest and newest supported Python, then launch it the way an
# MCP client does (.gitlab/ci/mcp_smoke.py: --version, initialize, tools/list,
# one tools/call), then runs `odoo-mcp upgrade`, which must pick the matching
# installer. pipx and uv tool put odoo-mcp in ~/.local/bin, which is not
# on PATH: the job proves it is missing, runs the documented step
# (`pipx ensurepath`, `uv tool update-shell`) and finds it in a new shell.
# service_dry_run.py renders the systemd unit `odoo-mcp service install`
# would write for that installer and runs its ExecStart with --version; the
# real systemd run is .gitlab/ci/service_systemd.sh, which needs a privileged
# container these runners do not provide.
#
# install:* run the wheel `build` made; verify-pypi:* run the same checks
# against PyPI — after publishing on a tag, and on a schedule, where a new
# release of a dependency can break an install nobody changed.
# ---------------------------------------------------------------------------
.install-smoke:
  image: python:${PYTHON}-slim
  stage: test
  parallel:
    matrix:
      - PYTHON: ["3.10", "3.14"]
  variables:
    PIP_ROOT_USER_ACTION: ignore
    # uv would otherwise download its own interpreter; use the one the matrix names.
    UV_PYTHON_PREFERENCE: only-system
    # pipx ensurepath and uv tool update-shell edit the rc file of the user's shell.
    SHELL: /bin/bash
  before_script:
    - VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' odoo_mcp_multi/__init__.py)"
    - echo "Installing $PACKAGE (expecting $VERSION)"

.from-wheel:
  extends: .install-smoke
  needs:
    - build
  before_script:
    - PACKAGE="$(ls dist/*.whl)"
    - !reference [.install-smoke, before_script]
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.from-pypi:
  extends: .install-smoke
  stage: notify
  needs:
    - job: publish:pypi
      optional: true
  before_script:
    - PACKAGE="odoo-mcp-multi==$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' odoo_mcp_multi/__init__.py)"
    - !reference [.install-smoke, before_script]
    # A fresh upload takes a moment to reach the index.
    - for attempt in $(seq 1 20); do pip download -q --no-deps -d /tmp/probe "$PACKAGE" && break; sleep 30; done
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

.pip-script:
  script:
    - pip install "$PACKAGE"
    - python .gitlab/ci/mcp_smoke.py "$VERSION" odoo-mcp
    - python .gitlab/ci/service_dry_run.py "$VERSION" odoo-mcp
    - odoo-mcp upgrade

.pipx-script:
  script:
    - pip install pipx
    - pipx install "$PACKAGE"
    - test -z "$(command -v odoo-mcp)"
    - pipx ensurepath
    - bash -lic 'odoo-mcp --version'
    - python .gitlab/ci/mcp_smoke.py "$VERSION" "$(pipx environment --value PIPX_BIN_DIR)/odoo-mcp"
    - python .gitlab/ci/service_dry_run.py "$VERSION" "$(pipx environment --value PIPX_BIN_DIR)/odoo-mcp"
    - bash -lic 'odoo-mcp upgrade'

.uv-tool-script:
  script:
    - pip install uv
    - uv tool install "$PACKAGE"
    - test -z "$(command -v odoo-mcp)"
    - uv tool update-shell
    - bash -lic 'odoo-mcp --version'
    - python .gitlab/ci/mcp_smoke.py "$VERSION" "$(uv tool dir --bin)/odoo-mcp"
    - python .gitlab/ci/service_dry_run.py "$VERSION" "$(uv tool dir --bin)/odoo-mcp"
    - bash -lic 'odoo-mcp upgrade'

.uvx-script:
  script:
    - pip install uv
    - python .gitlab/ci/mcp_smoke.py "$VERSION" uvx --from "$PACKAGE" odoo-mcp
    - PACKAGE="$PACKAGE" python .gitlab/ci/service_dry_run.py "$VERSION" uvx --from "$PACKAGE" odoo-mcp
    - uvx --from "$PACKAGE" odoo-mcp upgrade

install:pip:
  extends: [.from-wheel, .pip-script]

install:pipx:
  extends: [.from-wheel, .pipx-script]

install:uv-tool:
  extends: [.from-wheel, .uv-tool-script]

install:uvx:
  extends: [.from-wheel, .uvx-script]

verify-pypi:pip:
  extends: [.from-pypi, .pip-script]

verify-pypi:pipx:
  extends: [.from-pypi, .pipx-script]

verify-pypi:uv-tool:
  extends: [.from-pypi, .uv-tool-script]

verify-pypi:uvx:
  extends: [.from-pypi, .uvx-script]

# ---------------------------------------------------------------------------
# Auto-release: runs on main after lint+test pass.
# The bumpversion commit_message includes [skip ci] to break the loop.
#
# Bump level logic (commit-format agnostic, release is OPT-IN):
#   - Default: no release (no marker found in push commits)
#   - [patch] in any push commit → patch (0.3.0 → 0.3.1)
#   - [minor] in any push commit → minor (0.3.0 → 0.4.0)
#   - [major] in any push commit → major (0.4.0 → 1.0.0)
#
# Pushes a version commit + tag, which triggers the publish:* jobs.
#
# Requires CI/CD variable: RELEASE_TOKEN (project access token with
# write_repository scope). Set in Settings → CI/CD → Variables.
# ---------------------------------------------------------------------------
auto-release:
  interruptible: false
  extends: .python-template
  stage: release
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - |
      echo "==> Syncing tags with remote (pruning stale local tags)..."
      git fetch --tags --prune --prune-tags
      LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

      # Guard: if HEAD is already tagged, nothing to do.
      if git describe --tags --exact-match HEAD 2>/dev/null; then
        echo "==> HEAD is already tagged. Nothing to release."
        exit 0
      fi

      # Only inspect the commits that arrived in this push.
      # Release is OPT-IN: without [patch|minor|major] we do nothing.
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        PUSH_COMMITS=$(git log ${CI_COMMIT_BEFORE_SHA}..HEAD --pretty=format:"%s" 2>/dev/null)
      else
        PUSH_COMMITS=$(git log --pretty=format:"%s" -5)
      fi

      echo "==> Push commits:"
      echo "$PUSH_COMMITS"

      # Determine bump level — release only if an explicit marker is present.
      # Default is NO release (inverted from the old model).
      BUMP_LEVEL=""
      if echo "$PUSH_COMMITS" | grep -qi "\[major\]"; then
        BUMP_LEVEL="major"
      elif echo "$PUSH_COMMITS" | grep -qi "\[minor\]"; then
        BUMP_LEVEL="minor"
      elif echo "$PUSH_COMMITS" | grep -qi "\[patch\]"; then
        BUMP_LEVEL="patch"
      fi

      if [ -z "$BUMP_LEVEL" ]; then
        echo "==> No [patch|minor|major] found in push commits. Skipping release."
        echo "==> To release, add [patch], [minor] or [major] to a commit message."
        exit 0
      fi
      echo "==> Bump level: $BUMP_LEVEL"

      echo "==> Configuring git for push..."
      git config user.name "CI Release Bot"
      git config user.email "ci@vauxoo.com"
      git remote set-url origin "https://release-bot:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

      echo "==> Bumping version ($BUMP_LEVEL)..."
      # Use the git tag as --current-version (source of truth), not pyproject.toml.
      LAST_TAG_VERSION=$(echo "$LAST_TAG" | sed 's/^v//')
      if [ -n "$LAST_TAG_VERSION" ]; then
        echo "==> Using --current-version $LAST_TAG_VERSION (from git tag $LAST_TAG)"
        bump-my-version bump $BUMP_LEVEL --current-version "$LAST_TAG_VERSION"
      else
        bump-my-version bump $BUMP_LEVEL
      fi

      echo "==> Pushing version commit and tag..."
      git push origin HEAD:$CI_DEFAULT_BRANCH --tags

      NEW_TAG=$(git describe --tags --exact-match HEAD)
      echo "==> Released: $NEW_TAG"
  rules:
    - !reference [.not-on-schedule, rules]
    # Loop-prevention (layer 1): bump commits have [skip ci] so no pipeline.
    # Loop-prevention (layer 2): this rule never runs when commit IS a bump.
    - if: >-
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        && $CI_COMMIT_TAG == null
        && $CI_COMMIT_MESSAGE !~ /^Bump version:/
      when: on_success
  needs:
    - lint
    - test

# ---------------------------------------------------------------------------
# Publish the tag's CHANGELOG section as the GitLab Release description.
# The ai/marketplace announcer reads exactly this description (Releases API)
# to broadcast the news to Telegram — without it, announcements fall back to
# a generic placeholder and a dead /-/releases link. bump-my-version stamps
# the section (see [tool.bumpversion.files] for CHANGELOG.md), so the tag's
# checkout always contains it.
# ---------------------------------------------------------------------------
release-notes:
  interruptible: false
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: []
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - awk -v ver="[${VERSION}]" 'index($0, "## " ver) == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > release_notes.md
    - if [ ! -s release_notes.md ]; then echo "See CHANGELOG.md for details." > release_notes.md; fi
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: release_notes.md
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_COMMIT_TAG

pages:
  interruptible: false
  extends: .python-template
  stage: deploy
  needs:
    - job: test
      artifacts: true
  script:
    - mkdocs build -d public --strict
    - mkdir -p public/coverage
    - cp -r htmlcov/. public/coverage/
  artifacts:
    paths:
      - public
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

publish:pypi:
  extends: .python-template
  stage: deploy
  script:
    - pip install build twine
    - python -m build
    - twine upload --verbose dist/*
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_COMMIT_TAG

publish:gitlab:
  extends: .python-template
  stage: deploy
  script:
    - pip install build twine
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --verbose --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Notify the ai/marketplace catalog so it regenerates its index (see
# ci/trigger-from-plugin.md in that repo). SOURCE_REPO/SOURCE_TAG feed its
# release announcement job. The rules require CATALOG_TRIGGER_TOKEN — a
# group variable inherited once this repo lives in the `ai` group — so the
# job simply does not exist before the transfer.
# ---------------------------------------------------------------------------
notify-catalog:
  interruptible: false
  stage: deploy
  image: curlimages/curl:latest
  needs: []
  script:
    - curl -sS --fail -X POST -F token=$CATALOG_TRIGGER_TOKEN -F ref=main
      -F "variables[SOURCE_REPO]=$CI_PROJECT_PATH"
      -F "variables[SOURCE_TAG]=$CI_COMMIT_TAG"
      https://git.vauxoo.com/api/v4/projects/$CATALOG_PROJECT_ID/trigger/pipeline
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CATALOG_TRIGGER_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CATALOG_TRIGGER_TOKEN && $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Mirror: push main branch to GitHub via SSH deploy key.
# Requires CI/CD variable: GITHUB_MIRROR_SSH_KEY (file, protected, scope=main)
# containing the private Ed25519 key registered as a deploy key on GitHub.
# ---------------------------------------------------------------------------
mirror-to-github:
  interruptible: false
  stage: deploy
  image: alpine:3.20
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_MIRROR_SSH_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - git remote add github git@github.com:Vauxoo/mcp.odoo.git || true
    - git push github HEAD:main --force --tags
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_COMMIT_BRANCH == "main"
  needs: []

# Tell the marketplace catalog to re-index this plugin. Both variables are
# required: ai/marketplace's announce_telegram.py reads SOURCE_REPO and
# SOURCE_TAG, and when either is missing it prints "nothing to announce" and
# exits 0 — a silent no-op behind a green job.
notify_catalog:
  interruptible: false
  stage: notify
  image: curlimages/curl:latest
  script:
    - curl -sS --fail -X POST -F token=$CATALOG_TRIGGER_TOKEN -F ref=main
      -F "variables[SOURCE_REPO]=$CI_PROJECT_PATH"
      -F "variables[SOURCE_TAG]=$CI_COMMIT_TAG"
      https://git.vauxoo.com/api/v4/projects/$CATALOG_PROJECT_ID/trigger/pipeline
  rules:
    - !reference [.not-on-schedule, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
