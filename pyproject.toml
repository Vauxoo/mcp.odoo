[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-mcp-multi"
version = "0.18.0"
description = "MCP server for Odoo — connect Claude, Cursor, VS Code and Antigravity to multiple Odoo instances via Model Context Protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Nhomar Hernandez", email = "info@vauxoo.com" }
]
maintainers = [
    { name = "Nhomar Hernandez", email = "info@vauxoo.com" }
]
keywords = [
    "mcp", "mcp-server", "model-context-protocol",
    "odoo", "odoo-mcp", "odoo-ai", "odoo-erp", "odoo-integration",
    "claude", "claude-desktop", "cursor", "vscode", "antigravity",
    "erp", "xmlrpc", "json-rpc", "multi-instance", "multi-profile",
    "ai", "llm", "agentic", "ai-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Topic :: Office/Business",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp[cli]>=1.14.0,<2.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "certifi",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
http = [
    # Both already arrive transitively with mcp (uvicorn directly, cryptography
    # via pyjwt[crypto]); declaring them documents what `serve` imports and
    # keeps HTTP mode working if those transitive deps ever change.
    "uvicorn>=0.30",
    "cryptography>=42",
]
dev = [
    "pytest>=7.0.0",
    "uvicorn>=0.30",
    "cryptography>=42",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.30.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.1.0",
    "bump-my-version>=0.28.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
odoo-mcp = "odoo_mcp_multi.cli:main"

[project.urls]
Homepage = "https://git.vauxoo.com/ai/mcp.odoo"
Repository = "https://git.vauxoo.com/ai/mcp.odoo"
Documentation = "https://git.vauxoo.com/ai/mcp.odoo/-/blob/main/README.md"
"Issue Tracker" = "https://git.vauxoo.com/ai/mcp.odoo/-/issues"

[tool.hatch.build.targets.wheel]
packages = ["odoo_mcp_multi"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.bumpversion]
current_version = "0.18.0"
commit_message = "Bump version: {current_version} → {new_version} [skip ci]"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "odoo_mcp_multi/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "tests/test_basic.py"
search = "assert __version__ == \"{current_version}\""
replace = "assert __version__ == \"{new_version}\""

# THIS BLOCK IS THE CLASS MARKER — do not remove it to "comply" with the rule
# that every other hub follows.
#
# Across the Vauxoo agent ecosystem, a `version` key in
# `.claude-plugin/plugin.json` is a defect: the marketplace catalog does not
# copy it, so Claude Code reads the repository's own manifest and a declared
# version makes installs track version bumps instead of pushes. Here it is
# correct, because this repository is a Package-first Executor: the published
# package owns the version, and the plugin is one face of that package.
#
# The ecosystem's tooling detects the class by MEASURING, not by consulting a
# list of exempt repositories — and this block is one of the four clauses it
# measures. Delete it and two things break at once: the release stops
# propagating the version into the manifest, and the repository is reclassified
# as an ordinary Executor that is violating the rule. A fourth clause requires
# the two versions to AGREE on every run, so a drift between `current_version`
# above and the manifest below is reported as a P1, not tolerated as an
# exemption.
[[tool.bumpversion.files]]
filename = ".claude-plugin/plugin.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

# Stamps the Keep a Changelog "Unreleased" section at release time: whatever
# accumulated there becomes the new version's section (with today's date) and
# a fresh empty Unreleased header is left on top. The release-notes CI job
# then publishes that section as the GitLab Release description, which the
# ai/marketplace announcer broadcasts to Telegram.
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov --cov-report=term-missing --cov-report=xml --cov-context=test --ignore=tests/integration"
asyncio_mode = "auto"
testpaths = [
    "tests",
]
markers = [
    "integration: tests requiring live Odoo instances (deselected by default)",
]

[tool.coverage.run]
source_pkgs = ["odoo_mcp_multi"]
branch = true
relative_files = true

# CI tests the installed wheel on several Pythons; this maps each
# site-packages copy back to the source tree so the runs combine.
[tool.coverage.paths]
source = [
    "odoo_mcp_multi/",
    "*/site-packages/odoo_mcp_multi/",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.coverage.html]
show_contexts = true

